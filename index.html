<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JengaConnect clickable wireframe</title>
<style>
/* Greyscale wireframe look. Edit text in the render functions in the script below. */
:root{--ink:#222;--muted:#6a6a6a;--line:#4a4a4a;--soft:#f3f3f3;--fill:#dcdcdc}
*{box-sizing:border-box}
body{margin:0;background:#ececec;color:var(--ink);font:14px/1.4 Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px 12px}
.phone{width:390px;max-width:100%;height:min(780px,calc(100vh - 28px));min-height:560px;border:3px solid #555;border-radius:30px;background:#fff;padding:10px;position:relative}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden;border-radius:20px;position:relative}
.bar{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;background:var(--fill);font-weight:700;font-size:13px}
.bar .t{flex:1}
.bar .back{border:0;background:none;font-weight:700;text-decoration:underline;padding:0}
.body{flex:1;overflow-y:auto;padding:14px}
.nav{flex:none;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #777}
.nav button{border:0;border-right:1px solid #ccc;background:#fff;padding:14px 4px;font-size:12px}
.nav button:last-child{border:0}
.nav button.on{background:var(--fill);font-weight:700}
h2{font-size:17px;margin:0 0 10px;display:flex;gap:7px;align-items:center}
.lbl{display:block;font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.07em;margin:0 0 4px}
.f{margin:0 0 10px}
input,select,textarea{width:100%;border:1.5px solid #888;border-radius:4px;background:#fafafa;padding:9px;font-size:15px}
textarea{min-height:80px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.r3 input,.r3 select{padding:8px 5px;font-size:13px}
.btn{width:100%;min-height:44px;border:1.5px solid #555;border-radius:5px;background:#fff;font-weight:700;margin:0 0 8px}
.btn.p{background:#666;border-color:#666;color:#fff}
.btn:disabled{background:#eee;border-color:#ccc;color:#999;cursor:not-allowed}
.link{border:0;background:none;text-decoration:underline;font-size:12px;font-weight:700;padding:0}
.n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#333;color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;flex:none}
.card{display:flex;gap:9px;border:1.5px solid #888;border-radius:5px;padding:8px;margin:0 0 9px;width:100%;background:#fff;text-align:left}
.photo{background:#d4d4d4;border:1.5px solid #999;color:#777;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.card .photo{width:62px;height:62px}
.card b{font-size:14px}
.m{font-size:11px;color:#555}
.tag{display:inline-block;border:1px solid #777;background:#eee;font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;text-transform:uppercase}
.note{border:1px dashed #999;background:var(--soft);border-radius:5px;padding:9px;font-size:11.5px;margin:10px 0;color:#444}
.q{border:2px solid #333;border-radius:6px;padding:12px;margin:12px 0}
.q b{display:block;margin-bottom:8px}
.q .r2 .btn{margin:0}
.kv{border:1.5px solid #bbb;border-radius:5px;margin:0 0 12px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid #ddd;font-size:12px}
.kv div:last-child{border:0}
.kv span{color:#666}
.steps{list-style:none;margin:6px 0 12px;padding:0}
.steps li{display:flex;gap:9px;align-items:center;margin:7px 0;font-size:13px;color:#888}
.steps i{width:16px;height:16px;border-radius:50%;border:2px solid #777;flex:none}
.steps li.d{color:#222}.steps li.d i{background:#666}
.steps li.c{color:#000;font-weight:700}.steps li.c i{background:#333;outline:2px solid #333;outline-offset:2px}
.center{text-align:center;padding:26px 6px}
.choice{display:block;width:100%;border:2px solid #444;border-radius:8px;background:#fff;padding:18px 14px;margin:0 0 12px;text-align:left}
.choice b{display:block;font-size:17px;margin-bottom:3px}
.choice span{font-size:12px;color:#555}
.mod{border:1.5px dashed #777;border-radius:5px;padding:8px;margin-top:8px;background:#fafafa}
.mod .m{margin-bottom:6px;font-weight:700}
.mod .r2 .btn{margin:0;min-height:36px;font-size:12px}
.modal{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;padding:8px}
.sheet{background:#fff;border:1.5px solid #555;border-radius:12px;padding:14px;width:100%}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 12px;border-radius:5px;font-size:12px;z-index:9;max-width:85%;text-align:center}
@media(max-width:480px){.phone{border-radius:20px}</style>
</head>
<body>
<div class="page">
  <div class="phone"><div class="app" id="app"></div></div>
</div>

<script>
(function(){
"use strict";
// ---------- sample data (edit freely) ----------
const SEED=[
 {id:1,name:"Material A",qty:20,unit:"units",cond:"Used",area:"Kampala",price:"UGX ___",status:"Published"},
 {id:2,name:"Material B",qty:8,unit:"units",cond:"New",area:"Wakiso",price:"UGX ___",status:"Published"},
 {id:3,name:"Material C",qty:12,unit:"units",cond:"Damaged",area:"Kampala",price:"UGX ___",status:"Published"}];
const STEPS=["Contacted","Inspected","Agreed","Collected"];
const DEFAULT=()=>({role:null,screen:"landing",listings:JSON.parse(JSON.stringify(SEED)),sel:null,
  req:null,q:"",minQty:"",area:"all",edit:null,draft:{},rep:null,toast:""});
let S=DEFAULT();
const $=s=>document.querySelector(s);
const listing=id=>S.listings.find(l=>l.id===id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const photo=cls=>`<span class="photo ${cls||""}">photo</span>`;
function go(screen){S.screen=screen;render();const b=$(".body");if(b)b.scrollTop=0}
function toast(t){S.toast=t;render();setTimeout(()=>{S.toast="";const e=$(".toast");if(e)e.remove()},2200)}
function step(){ // tracker index from request status
  if(!S.req)return 0;
  return {sent:0,counter:0,accepted:0,inspected:1,agreed:2,collected:3,closed:3}[S.req.status];}

// ---------- shared pieces ----------
const bar=(title,back)=>`<div class="bar">${back?`<button class="back" data-act="go" data-v="${back}">‹ Back</button>`:""}<span class="t">${title}</span>${S.screen==="landing"?"":`<button class="back" id="home" style="font-weight:400;font-size:11px">Switch role</button>`}</div>`;
const nav=(items,on)=>`<div class="nav">${items.map(([k,t])=>`<button data-act="go" data-v="${k}" class="${k===on?"on":""}">${t}</button>`).join("")}</div>`;
const buyerNav=on=>nav([["b-browse","Browse"],["b-requests","Requests"]],on);
const sellerNav=on=>nav([["s-listings","My listings"],["s-requests","Requests"]],on);
const reportSheet=()=>S.rep?`<div class="modal"><div class="sheet">
  <h2>Report ${S.rep==="inspection"?"inspection problem":"listing"}</h2>
  <p class="note" style="margin-top:0">Reports go to moderators.</p>
  <div class="f"><label class="lbl">Reason</label><select id="rr"><option value="">Choose a reason</option><option>Wrong material or quantity</option><option>Already sold or not available</option><option>Unsafe or misleading listing</option><option>Price or permission problem</option><option>Other</option></select></div>
  <div class="f"><label class="lbl">What happened?</label><textarea id="rd" placeholder="Tell moderators what happened…"></textarea></div>
  <button class="btn p" data-act="sendReport">Submit report</button><button class="btn" data-act="closeReport">Cancel</button></div></div>`:"";

// ---------- screens ----------
const V={};
V.landing=()=>({html:`<div class="body" style="display:flex;flex-direction:column;justify-content:center">
  <div class="center" style="padding:0 0 26px"><div class="photo" style="width:72px;height:72px;margin:0 auto 14px;border-radius:50%">logo</div>
  <h2 style="justify-content:center;font-size:26px;margin-bottom:4px">JengaConnect</h2>
  <p class="m">Log in to continue</p></div>
  <button class="btn p" data-act="role" data-v="buyer" style="min-height:50px;font-size:15px">Log in as Buyer</button>
  <button class="btn" data-act="role" data-v="seller" style="min-height:50px;font-size:15px">Log in as Seller</button>
  <p style="text-align:center;margin-top:22px"><button class="link" id="restart" style="font-weight:400;color:#777">Reset demo</button></p></div>`});

// BUYER
V["b-browse"]=()=>{
  const q=S.q.trim().toLowerCase(),mq=Number(S.minQty)||0;
  const res=S.listings.filter(l=>l.status==="Published"&&(!q||l.name.toLowerCase().includes(q))&&(!mq||l.qty>=mq)&&(S.area==="all"||l.area===S.area));
  return {html:`${bar("JengaConnect")}<div class="body">
  <h2>Find materials <i class="n">1</i></h2>
  <div class="f"><label class="lbl">Search material</label><input id="q" type="search" placeholder="Material (e.g. bricks, cement)" value="${esc(S.q)}"></div>
  <div class="r3 f"><div><label class="lbl">Quantity</label><input id="mq" type="number" min="1" placeholder="___" value="${esc(S.minQty)}"></div>
   <div><label class="lbl">Area</label><select id="ar"><option value="all">All</option><option ${S.area==="Kampala"?"selected":""}>Kampala</option><option ${S.area==="Wakiso"?"selected":""}>Wakiso</option></select></div>
   <div><label class="lbl">Collection</label><select><option>pick-up</option></select></div></div>
  <p class="m"><b>${res.length} listing${res.length===1?"":"s"}</b></p>
  ${res.map(l=>`<button class="card" data-act="open" data-v="${l.id}">${photo()}<span><b>${esc(l.name)}</b> · ${l.qty} ${l.unit}<br><span class="m">Condition: ${l.cond}<br>${l.area} · ${l.price}</span></span></button>`).join("")}
  ${res.length?"":`<div class="note center"><b>No matching listings nearby</b><br>Change filters and try again.<br><br><button class="btn" data-act="clear" style="width:auto;padding:0 18px">Change filters</button></div>`}
  </div>${buyerNav("b-browse")}`}};

V["b-listing"]=()=>{const l=listing(S.sel);return {html:`${bar("Listing","b-browse")}<div class="body">
  <div class="photo" style="height:120px;margin-bottom:10px">photos (swipe) <i class="n" style="margin-left:6px">2</i></div>
  <div class="kv"><div><span>Material</span><b>${esc(l.name)}</b></div><div><span>Quantity</span><b>${l.qty} ${l.unit}</b></div><div><span>Condition</span><b>${l.cond}</b></div><div><span>General area</span><b>${l.area}</b></div><div><span>Asking price</span><b>${l.price}</b></div><div><span>Seller permission</span><b>stated</b></div></div>
  <p class="m">Exact site address is not shown.</p>
  <div class="q"><b>Are the condition and quantity acceptable?</b>
   <button class="btn p" data-act="go" data-v="b-contact" style="margin-bottom:8px">Yes · ask the seller</button>
   <button class="btn" data-act="go" data-v="b-browse" style="margin:0">No · back to Browse</button></div>
  <button class="link" data-act="report" data-v="listing">Report listing <i class="n" style="margin-left:4px">5</i></button>
  </div>${buyerNav("b-browse")}${reportSheet()}`}};

V["b-contact"]=()=>{const l=listing(S.sel);return {html:`${bar("Contact seller","b-listing")}<div class="body">
  <h2>Contact the seller <i class="n">3</i></h2>
  <div class="card" style="cursor:default">${photo()}<span><b>${esc(l.name)}</b><br><span class="m">${l.qty} ${l.unit} · ${l.area}</span></span></div>
  <p class="lbl">Quick questions</p>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${["Still available?","Can I inspect first?","Part quantity?","Collection cost?"].map(t=>`<button class="card" style="width:auto;padding:5px 10px;border-radius:14px;margin:0;font-size:11px" data-act="chip" data-v="${t}">${t}</button>`).join("")}</div>
  <div class="f"><textarea id="msg" placeholder="Type a question…"></textarea></div>
  <p class="lbl">Propose an inspection time</p>
  <div class="r2 f"><select id="dt"><option value="">Date</option><option>Tomorrow</option><option>This Saturday</option><option>Next Saturday</option></select><select id="tm"><option value="">Time</option><option>Morning 09:00–12:00</option><option>Afternoon 14:00–17:00</option></select></div>
  <button class="btn p" data-act="send">Send request</button></div>${buyerNav("b-browse")}`}};

function buyerStatusPanel(){
  const r=S.req,st=r.status;
  if(st==="sent")return `<div class="note"><b>Waiting for the seller to reply.</b><br>Demo: switch role (top right) to Seller, open Requests and respond.</div>`;
  if(st==="counter")return `<div class="q"><b>Seller suggested another time: ${esc(r.time)}</b><button class="btn p" data-act="acceptCounter">Accept this time</button><button class="btn" data-act="cancelReq" style="margin:0">No · back to Browse</button></div>`;
  if(st==="accepted")return `<div class="note">Seller agreed to inspection: <b>${esc(r.time)}</b></div><div class="q"><b>After inspecting: does it confirm the listing?</b><div class="r2"><button class="btn p" data-act="inspectYes">Yes</button><button class="btn" data-act="inspectNo">No</button></div></div>`;
  if(st==="inspected")return `<div class="q"><b>Agree quantity, window and total cost. Is the total cost still worthwhile?</b><div class="r2"><button class="btn p" data-act="costYes">Yes</button><button class="btn" data-act="cancelReq">No · cancel</button></div></div>`;
  if(st==="agreed")return `<button class="btn p" data-act="collected">Collect material and mark complete</button>`;
  return `<div class="note">Marked complete. Waiting for the seller to confirm collection.</div>`;
}
V["b-collection"]=()=>{const r=S.req,l=listing(r.lid),i=step();return {html:`${bar("Collection","b-requests")}<div class="body">
  <div class="card" style="cursor:default">${photo()}<span><b>${esc(l.name)}</b><br><span class="m">${l.qty} ${l.unit} · ${l.area}</span></span></div>
  <div class="kv"><div><span>Agreed quantity</span><b>${l.qty} ${l.unit}</b></div><div><span>Collection window</span><b>${esc(r.time||"___")}</b></div><div><span>Total cost</span><b>UGX ___ + transport</b></div></div>
  <p class="lbl">Status <i class="n" style="margin-left:4px">4</i></p>
  <ul class="steps">${STEPS.map((s,k)=>`<li class="${k<i?"d":k===i?"c":""}"><i></i>${s}</li>`).join("")}</ul>
  ${buyerStatusPanel()}
  <p style="margin-top:10px"><button class="link" data-act="report" data-v="listing">Problem? Report to moderators <i class="n" style="margin-left:4px">5</i></button></p>
  </div>${buyerNav("b-requests")}${reportSheet()}`}};

V["b-requests"]=()=>{const r=S.req;return {html:`${bar("Requests")}<div class="body">
  ${r?`<button class="card" data-act="go" data-v="b-collection" style="display:block"><b>${esc(listing(r.lid).name)}</b> <span class="tag" style="float:right">${r.status==="closed"?"Complete":r.status==="collected"?"Collected":STEPS[step()]}</span><br><span class="m">Tap to view collection</span></button>`
  :`<div class="note center"><b>No requests yet</b><br>Requests you send will appear here.<br><br><button class="btn p" data-act="go" data-v="b-browse" style="width:auto;padding:0 18px">Browse materials</button></div>`}
  </div>${buyerNav("b-requests")}`}};

V["b-complete"]=()=>({html:`${bar("Complete")}<div class="body"><div class="center"><h2 style="justify-content:center">Exchange complete</h2><p class="m">You marked this collection as complete.<br>The seller will confirm collection.</p><button class="btn p" data-act="go" data-v="b-browse" style="width:auto;padding:0 20px">Back to Browse</button></div></div>${buyerNav("b-requests")}`});

// SELLER
V["s-create"]=()=>{const d=S.draft;return {html:`${bar(S.edit?"Edit listing":"New listing","s-listings")}<div class="body">
  <div class="f"><label class="lbl">Material</label><input id="cm" value="${esc(d.name||"")}" placeholder="Material"></div>
  <div class="r2 f"><div><label class="lbl">Quantity</label><input id="cq" type="number" min="1" value="${esc(d.qty||"")}" placeholder="___"></div>
   <div><label class="lbl">Unit</label><select id="cu">${["units","bags","pieces","metres"].map(u=>`<option ${d.unit===u?"selected":""}>${u}</option>`).join("")}</select></div></div>
  <div class="r2 f"><div><label class="lbl">Condition</label><select id="cc">${["New","Used","Damaged"].map(u=>`<option ${d.cond===u?"selected":""}>${u}</option>`).join("")}</select></div>
   <div><label class="lbl">General area</label><select id="ca">${["Kampala","Wakiso"].map(u=>`<option ${d.area===u?"selected":""}>${u}</option>`).join("")}</select></div></div>
  <div class="f"><label class="lbl">Asking price</label><input id="cp" value="${esc(d.price||"")}" placeholder="UGX ___"></div>
  <div class="r2 f"><span class="photo" style="height:60px">+ photo</span><span class="photo" style="height:60px">+ photo</span></div>
  <label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;margin:8px 0 12px"><input id="cperm" type="checkbox" style="width:auto;margin-top:2px" ${d.perm?"checked":""}>I have permission to sell this material</label>
  <p class="m" id="cerr" hidden style="color:#000;font-weight:700">Add a material, a quantity and tick the permission box.</p>
  <button class="btn p" data-act="submit">Submit for review</button></div>${sellerNav("s-listings")}`}};

V["s-listings"]=()=>({html:`${bar("My listings")}<div class="body">
  <button class="btn p" data-act="new">+ New listing</button>
  ${S.listings.map(l=>`<div class="card" style="display:block"><div style="display:flex;gap:9px">${photo()}<span style="flex:1"><b>${esc(l.name)}</b> · ${l.qty} ${l.unit}<br><span class="m">${l.cond} · ${l.area}</span><br><span class="tag">${l.status}</span></span></div>
    ${l.status==="Pending review"?`<div class="mod"><div class="m">Moderator check (demo): passed?</div><div class="r2"><button class="btn p" data-act="mod" data-v="${l.id}:ok">Yes · publish</button><button class="btn" data-act="mod" data-v="${l.id}:no">No · reject</button></div></div>`:""}
    ${l.status==="Rejected"?`<button class="btn" style="margin:8px 0 0" data-act="editL" data-v="${l.id}">Edit and resubmit</button>`:""}</div>`).join("")}
  <p class="m">Listings are checked by moderators before they appear to buyers. <i class="n">5</i></p>
  </div>${sellerNav("s-listings")}`});

V["s-requests"]=()=>{const r=S.req;let inner;
  if(!r)inner=`<div class="note center"><b>No buyer requests yet</b><br>Demo: switch role to Buyer, find a listing and send a request.</div>`;
  else{const l=listing(r.lid),st=r.status;
   inner=`<div class="card" style="display:block"><b>${esc(l.name)}</b> · ${l.qty} ${l.unit} <span class="tag" style="float:right">${st==="sent"?"New":st==="counter"?"Awaiting buyer":st==="accepted"||st==="inspected"||st==="agreed"?"Reserved":st==="collected"?"Collected":st==="closed"?"Closed":st}</span>
    <div class="note">“${esc(r.msg||"Is this still available?")}”<br><span class="m">Proposed inspection: ${esc(r.time||"not set")}</span></div>
    ${st==="sent"?`<div class="q"><b>Accept the inspection time?</b><button class="btn p" data-act="accept">Accept</button><div class="r2 f" style="margin-bottom:8px"><select id="sdt"><option>Tomorrow</option><option>This Saturday</option><option>Next Saturday</option></select><select id="stm"><option>Morning 09:00–12:00</option><option>Afternoon 14:00–17:00</option></select></div><button class="btn" data-act="counter" style="margin:0">Suggest another time</button></div>`:""}
    ${st==="counter"?`<p class="m">You suggested: ${esc(r.time)}. Demo: switch to Buyer to respond.</p>`:""}
    ${st==="accepted"||st==="inspected"||st==="agreed"?`<p class="m">Buyer is inspecting and agreeing collection.</p>`:""}
    ${st==="collected"?`<p class="m">Buyer says collection is done.</p><button class="btn p" data-act="confirmColl">Confirm collection</button>`:""}
    ${st==="closed"?`<p class="m"><b>Listing collected.</b> Exchange finished.</p>`:""}</div>`;}
  return {html:`${bar("Requests")}<div class="body">${inner}</div>${sellerNav("s-requests")}`}};

// ---------- render ----------
function render(){
  const v=V[S.screen]();
  $("#app").innerHTML=`${v.html}${S.toast?`<div class="toast">${esc(S.toast)}</div>`:""}`;
  const q=$("#q");if(q&&document.activeElement===document.body&&S._focusQ){q.focus();q.setSelectionRange(q.value.length,q.value.length);S._focusQ=false}
}

// ---------- actions ----------
const A={
 go:v=>go(v),
 role:v=>{S.role=v;go(v==="buyer"?"b-browse":"s-listings")},
 open:v=>{S.sel=+v;go("b-listing")},
 clear:()=>{S.q="";S.minQty="";S.area="all";render()},
 report:v=>{S.rep=v;render()},
 closeReport:()=>{S.rep=null;render()},
 sendReport:()=>{if(!$("#rr").value){$("#rr").focus();return}const insp=S.rep==="inspection";S.rep=null;
   if(insp){S.req=null;S.listings.forEach(l=>{if(l.status==="Reserved")l.status="Published"});go("b-browse")}else render();
   toast("Report sent to moderators")},
 chip:v=>{const m=$("#msg");m.value=m.value?m.value+"\n"+v:v;m.focus()},
 send:()=>{const msg=$("#msg").value.trim(),d=$("#dt").value,t=$("#tm").value;
   S.req={lid:S.sel,msg,time:[d,t].filter(Boolean).join(" · "),status:"sent"};go("b-collection");toast("Request sent")},
 acceptCounter:()=>{S.req.status="accepted";render();toast("Time accepted")},
 cancelReq:()=>{S.req=null;S.listings.forEach(l=>{if(l.status==="Reserved")l.status="Published"});go("b-browse");toast("Request cancelled")},
 inspectYes:()=>{S.req.status="inspected";render()},
 inspectNo:()=>{S.rep="inspection";render()},
 costYes:()=>{S.req.status="agreed";render()},
 collected:()=>{S.req.status="collected";go("b-complete")},
 new:()=>{S.edit=null;S.draft={};go("s-create")},
 editL:v=>{const l=listing(+v);S.edit=l.id;S.draft={name:l.name,qty:l.qty,unit:l.unit,cond:l.cond,area:l.area,price:l.price==="UGX ___"?"":l.price,perm:false};go("s-create")},
 submit:()=>{const name=$("#cm").value.trim(),qty=Number($("#cq").value),perm=$("#cperm").checked;
   if(!name||!qty||!perm){$("#cerr").hidden=false;return}
   const data={name,qty,unit:$("#cu").value,cond:$("#cc").value,area:$("#ca").value,price:$("#cp").value.trim()||"UGX ___",status:"Pending review"};
   if(S.edit)Object.assign(listing(S.edit),data);else S.listings.unshift(Object.assign({id:Date.now()},data));
   S.edit=null;go("s-listings");toast("Submitted for review")},
 mod:v=>{const [id,res]=v.split(":");listing(+id).status=res==="ok"?"Published":"Rejected";render();toast(res==="ok"?"Listing published":"Listing rejected: edit and resubmit")},
 accept:()=>{S.req.status="accepted";listing(S.req.lid).status="Reserved";render();toast("Inspection accepted")},
 counter:()=>{S.req.time=$("#sdt").value+" · "+$("#stm").value;S.req.status="counter";render();toast("New time suggested")},
 confirmColl:()=>{S.req.status="closed";listing(S.req.lid).status="Collected";render();toast("Listing collected")}
};
document.addEventListener("click",e=>{
  if(e.target.id==="restart"){S=DEFAULT();render();return}
  if(e.target.id==="home"){S.role=null;S.rep=null;go("landing");return}
  const el=e.target.closest("[data-act]");if(el&&A[el.dataset.act])A[el.dataset.act](el.dataset.v)});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;S._focusQ=true;render()}
  if(e.target.id==="mq"){S.minQty=e.target.value;render();const m=$("#mq");m.focus();m.setSelectionRange(m.value.length,m.value.length)}});
document.addEventListener("change",e=>{if(e.target.id==="ar"){S.area=e.target.value;render()}});
render();
})();
</script>
</body>
</html>
