<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>JengaConnect clickable wireframe</title>
	<style>
		/* Same look as the JengaConnect wireframes. Every button simply moves to the next step. */
		* {
			box-sizing: border-box
		}

		body {
			margin: 0;
			background: #fff;
			color: #222;
			font-family: Arial, Helvetica, sans-serif
		}

		button,
		input,
		select,
		textarea {
			font: inherit;
			color: inherit
		}

		button {
			cursor: pointer
		}

		.page {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 14px
		}

		.phone {
			width: 372px;
			max-width: 100%;
			height: min(760px, calc(100vh - 28px));
			min-height: 600px;
			border: 3px solid #555;
			border-radius: 30px;
			background: #fff;
			padding: 16px 15px;
			position: relative;
			overflow: hidden
		}

		.screen {
			height: 100%;
			display: flex;
			flex-direction: column;
			overflow-y: auto
		}

		.bar {
			flex: none;
			height: 38px;
			background: #d9d9d9;
			border-radius: 5px;
			display: flex;
			align-items: center;
			padding: 0 11px;
			font-size: 15px;
			font-weight: 700;
			margin-bottom: 11px;
			gap: 8px
		}

		.bar .t {
			flex: 1
		}

		.bar button {
			border: 0;
			background: none;
			font-weight: 700;
			font-size: 15px;
			padding: 0
		}

		.bar .exit {
			font-size: 11px;
			font-weight: 400;
			color: #555;
			text-decoration: underline
		}

		.fld {
			border: 1.5px solid #888;
			border-radius: 4px;
			min-height: 36px;
			margin: 7px 0;
			padding: 0 10px;
			font-size: 14px;
			display: flex;
			align-items: center;
			color: #555;
			background: #fafafa;
			width: 100%
		}

		input.fld,
		select.fld,
		textarea.fld {
			outline: 0
		}

		textarea.fld {
			padding: 8px 10px;
			min-height: 84px;
			align-items: flex-start;
			resize: none
		}

		.row2 {
			display: flex;
			gap: 8px
		}

		.row2>* {
			flex: 1;
			min-width: 0
		}

		.card {
			border: 1.5px solid #888;
			border-radius: 6px;
			display: flex;
			gap: 10px;
			padding: 8px;
			margin: 8px 0;
			font-size: 14px;
			line-height: 1.35;
			background: #fff;
			text-align: left;
			width: 100%
		}

		.img {
			width: 68px;
			height: 68px;
			background: #cfcfcf;
			border: 1.5px solid #999;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #777;
			font-size: 12px;
			flex: none
		}

		.bigimg {
			width: 100%;
			height: 130px;
			background: #cfcfcf;
			border: 1.5px solid #999;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #777;
			font-size: 14px;
			margin-bottom: 10px;
			gap: 6px
		}

		.btn {
			width: 100%;
			min-height: 42px;
			background: #6b6b6b;
			color: #fff;
			border: 0;
			border-radius: 6px;
			font-size: 14px;
			font-weight: 700;
			margin: 9px 0 0
		}

		.btn.alt {
			background: #fff;
			color: #444;
			border: 1.5px solid #6b6b6b
		}

		.kv {
			font-size: 14px;
			display: grid;
			grid-template-columns: 104px 1fr;
			gap: 7px 8px;
			margin: 7px 0
		}

		.kv b {
			color: #555
		}

		.chip {
			display: inline-block;
			border: 1.5px solid #888;
			border-radius: 14px;
			font-size: 12.5px;
			padding: 5px 11px;
			margin: 4px 4px 0 0;
			background: #fff
		}

		.steps {
			margin: 8px 0
		}

		.step {
			display: flex;
			align-items: center;
			gap: 10px;
			font-size: 14px;
			margin: 9px 0
		}

		.dot {
			width: 19px;
			height: 19px;
			border-radius: 50%;
			border: 2px solid #666;
			flex: none
		}

		.dot.on {
			background: #666
		}

		.tag {
			display: inline-flex;
			width: 21px;
			height: 21px;
			border-radius: 50%;
			background: #254F18;
			color: #fff;
			font-size: 12px;
			font-weight: 700;
			align-items: center;
			justify-content: center;
			flex: none
		}

		.small {
			font-size: 12px;
			color: #666;
			margin: 6px 0;
			display: flex;
			align-items: center;
			gap: 6px
		}

		.q {
			border: 2px solid #254F18;
			border-radius: 7px;
			padding: 11px;
			margin: 12px 0 0
		}

		.q p {
			margin: 0 0 3px;
			font-size: 14px;
			font-weight: 700
		}

		.demo {
			border: 1.5px dashed #888;
			border-radius: 6px;
			padding: 10px;
			margin: 12px 0 0;
			background: #fafafa
		}

		.status {
			display: inline-block;
			border: 1px solid #777;
			border-radius: 3px;
			background: #eee;
			font-size: 11px;
			font-weight: 700;
			padding: 1px 6px
		}

		.logo {
			width: 84px;
			height: 84px;
			border-radius: 50%;
			background: #d4d4d4;
			border: 1.5px solid #999;
			color: #777;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 14px;
			font-size: 13px
		}

		.center {
			text-align: center
		}

		.grow {
			flex: 1
		}
	</style>
</head>

<body>
	<div class="page">
		<div class="phone">
			<div class="screen" id="screen"></div>
		</div>
	</div>

	<script>
		(function () {
			"use strict";
			const tag = n => `<span class="tag">${n}</span>`;
			const exit = `<button class="exit" data-go="login">Exit</button>`;
			const bar = (title, back = true) => `<div class="bar">${back ? `<button data-back>‹ Back</button>` : ""}<span class="t">${title}</span>${exit}</div>`;
			const listingCard = n => `<button class="card" data-go="b-listing"><span class="img">photo</span><span><b>Material ${n} · qty</b><br>Condition: ___<br>Area · UGX ___</span></button>`;
			const steps = on => `<div class="steps">${["Contacted", "Inspected", "Agreed", "Collected"].map((s, i) => `<div class="step"><span class="dot ${i < on ? "on" : ""}"></span>${s}</div>`).join("")}</div>`;
			const reqCard = (m, q, st) => `<button class="card" data-go="s-request"><span class="img">photo</span><span><b>${m}</b><br>${q}<br><span class="status">${st}</span> · tap to open</span></button>`;
			const sellerCard = status => `<div class="card" style="cursor:default"><span class="img">photo</span><span><b>Material · qty</b><br>Status: <span class="status">${status}</span></span></div>`;

			// every screen below; every button moves to the next step, whatever has been typed
			const SCREENS = {
				login: () => `<div class="grow"></div><div class="center"><div class="logo">logo</div><h2 style="margin:0 0 4px;font-size:26px">JengaConnect</h2><p class="small" style="justify-content:center">Log in to continue</p></div>
 <button class="btn" data-go="b-browse" style="min-height:48px;font-size:15px;margin-top:22px">Log in as Buyer</button>
 <button class="btn alt" data-go="s-create" style="min-height:48px;font-size:15px">Log in as Seller</button><div class="grow"></div>`,

				// ----- BUYER -----
				"b-browse": () => `${bar("JengaConnect", false)}
 <div class="fld">${tag(1)}&nbsp;&nbsp;Material (e.g. bricks, cement)</div>
 <div class="row2"><div class="fld">Quantity</div><div class="fld">Area ▾</div></div>
 <div class="fld">Collection: pick-up ▾</div>
 ${listingCard("A")}${listingCard("B")}${listingCard("C")}`,

				"b-listing": () => `${bar("Listing")}
 <div class="bigimg">${tag(2)}photos (swipe)</div>
 <div class="kv"><b>Material</b><span>_______</span><b>Quantity</b><span>___ units</span><b>Condition</b><span>new / used / damaged</span><b>Area</b><span>general only</span><b>Asking</b><span>UGX ___</span><b>Seller</b><span>permission stated</span></div>
 <div class="small">Exact site address is not shown.</div>
 <button class="btn" data-go="b-contact">Ask the seller</button>
 <button class="btn alt" data-go="report-listing">Report listing</button>`,

				"report-listing": () => `${bar("Report listing")}
 <div class="small">${tag(5)}Reports go to moderators</div>
 <select class="fld"><option>Reason ▾</option><option>Wrong material or quantity</option><option>Unsafe or misleading</option><option>Other</option></select>
 <textarea class="fld" placeholder="What happened?"></textarea>
 <button class="btn" data-go="b-browse">Submit report</button>`,

				"b-contact": () => `${bar("Contact seller")}
 <div class="small">${tag(3)}Quick questions</div>
 <div><span class="chip">Still available?</span><span class="chip">Can I inspect first?</span><span class="chip">Part quantity?</span><span class="chip">Collection cost?</span></div>
 <textarea class="fld" placeholder="Type a question…" style="margin-top:12px"></textarea>
 <div class="small" style="margin-top:8px">Inspection arrangement</div>
 <div class="row2"><select class="fld"><option>Date ▾</option><option>Tomorrow</option><option>This Saturday</option></select><select class="fld"><option>Time ▾</option><option>Morning</option><option>Afternoon</option></select></div>
 <button class="btn" data-go="b-waiting">Send request</button>`,

				"b-waiting": () => `${bar("Request sent")}
 <div class="center" style="padding:30px 0 14px"><div class="logo" style="width:64px;height:64px;font-size:11px">sent</div><b>Waiting for the seller to reply</b><div class="small" style="justify-content:center">Material · qty</div></div>
 <div class="demo"><div class="small" style="margin:0 0 4px"><b>Seller side (demo)</b></div><div class="small" style="margin:0">Seller replies and agrees to the inspection.</div>
 <button class="btn" data-go="b-inspect">Seller agrees to inspection</button></div>`,

				"b-inspect": () => `${bar("Inspection")}
 <div class="kv"><b>Seller</b><span>agreed</span><b>Inspection</b><span>day · time</span><b>Material</b><span>_______</span></div>
 <div class="small">Buyer inspects the material at the agreed time.</div>
 <div class="q"><p>Does the inspection confirm the listing?</p>
  <button class="btn" data-go="b-collection">Yes</button>
  <button class="btn alt" data-go="report-inspect">No · report to moderators</button></div>`,

				"report-inspect": () => `${bar("Report to moderators")}
 <div class="small">${tag(5)}Listing did not match the inspection</div>
 <select class="fld"><option>Reason ▾</option><option>Wrong material or quantity</option><option>Condition worse than listed</option><option>Other</option></select>
 <textarea class="fld" placeholder="What happened?"></textarea>
 <button class="btn" data-go="b-browse">Submit report · back to Browse</button>`,

				"b-collection": () => `${bar("Collection")}
 <div class="kv"><b>Agreed qty</b><span>___ units</span><b>Window</b><span>day · time</span><b>Total cost</b><span>UGX ___ + transport</span></div>
 <div class="small">${tag(4)}Status</div>${steps(2)}
 <div class="q"><p>Is the total cost still worthwhile?</p>
  <button class="btn" data-go="b-agreed">Yes · agree</button>
  <button class="btn alt" data-go="b-browse">No · cancel</button></div>
 <div class="small" style="margin-top:12px">${tag(5)}<button data-go="report-inspect" style="border:0;background:none;padding:0;font-size:12px;color:#666;text-decoration:underline">Problem? Report to moderators</button></div>`,

				"b-agreed": () => `${bar("Collection")}
 <div class="kv"><b>Agreed qty</b><span>___ units</span><b>Window</b><span>day · time</span><b>Total cost</b><span>UGX ___ + transport</span></div>
 <div class="small">${tag(4)}Status</div>${steps(3)}
 <button class="btn" data-go="b-done">Collect material · mark complete</button>`,

				"b-done": () => `<div class="grow"></div><div class="center"><div class="logo">done</div><h2 style="margin:0 0 6px">Exchange complete</h2>
 <div class="small" style="justify-content:center">The seller confirms collection</div>${steps(4)}</div>
 <button class="btn" data-go="login">Back to start</button><div class="grow"></div>`,

				// ----- SELLER -----
				"s-create": () => `${bar("New listing", false)}
 <div class="fld">${tag(1)}&nbsp;&nbsp;Material</div>
 <div class="row2"><input class="fld" placeholder="Quantity"><select class="fld"><option>Unit ▾</option><option>units</option><option>bags</option></select></div>
 <select class="fld"><option>Condition: new / used / damaged ▾</option><option>New</option><option>Used</option><option>Damaged</option></select>
 <select class="fld"><option>General area ▾</option><option>Kampala</option><option>Wakiso</option></select>
 <input class="fld" placeholder="Asking price: UGX ___">
 <div class="row2" style="margin-top:7px"><div class="img" style="width:auto;height:50px">+ photo</div><div class="img" style="width:auto;height:50px">+ photo</div></div>
 <label class="small" style="margin:10px 0 0"><input type="checkbox" style="width:auto"> I have permission to sell this material</label>
 <button class="btn" data-go="s-listings">Submit for review</button>`,

				"s-listings": () => `${bar("My listings")}
 ${sellerCard("Pending review")}
 <div class="demo"><div class="small" style="margin:0 0 2px"><b>Moderator check (demo)</b></div><div class="small" style="margin:0">${tag(2)}Listings are checked before they appear</div>
  <button class="btn" data-go="s-published">Passed · publish</button></div>`,

				"s-published": () => `${bar("My listings")}
 ${sellerCard("Published")}
 <div class="small">Listing is now visible to buyers.</div>
 <div class="demo"><div class="small" style="margin:0"><b>Buyers have sent requests (demo)</b></div>
  <button class="btn" data-go="s-requests">Open Requests</button></div>`,

				"s-requests": () => `${bar("Requests")}
 <div class="small">Buyer requests for your listings</div>
 ${reqCard("Material A · qty", "“Can I inspect first?”", "New")}
 ${reqCard("Material B · qty", "“Part quantity?”", "New")}
 ${reqCard("Material C · qty", "“Still available?”", "Replied")}`,

				"s-request": () => `${bar("Buyer request")}
 <div class="small">${tag(3)}Buyer question</div>
 <div class="fld" style="min-height:50px;align-items:flex-start;padding-top:8px">“Can I inspect first?”</div>
 <div class="kv"><b>Proposed</b><span>date · time</span><b>Quantity</b><span>___ units</span></div>
 <button class="btn" data-go="s-reserved">Accept</button>
 <button class="btn alt" data-go="s-reserved">Suggest another time</button>`,

				"s-reserved": () => `${bar("Reserved")}
 ${sellerCard("Reserved")}
 <div class="small" style="margin-top:10px">Buyer inspects and collects the material.</div>
 <div class="small">${tag(4)}After inspection</div>
 <button class="btn" data-go="s-done">Confirm collection</button>`,

				"s-done": () => `<div class="grow"></div><div class="center"><div class="logo">done</div><h2 style="margin:0 0 6px">Listing collected</h2>
 <div class="small" style="justify-content:center">Exchange finished</div></div>
 ${sellerCard("Collected")}
 <button class="btn" data-go="login">Back to start</button><div class="grow"></div>`
			};

			// ---------- navigation ----------
			let current = "login", stack = [];
			function show(id, push) {
				if (push) stack.push(current);
				if (id === "login") stack = [];
				current = id;
				const el = document.getElementById("screen");
				el.innerHTML = SCREENS[id]();
				el.scrollTop = 0;
			}
			document.addEventListener("click", e => {
				const go = e.target.closest("[data-go]");
				if (go) {show(go.dataset.go, true); return }
				if (e.target.closest("[data-back]")) show(stack.pop() || "login", false);
			});
			show("login", false);
		})();
	</script>
</body>

</html>
